[package]
name = "frand"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
if-addrs = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = "=0.24.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
